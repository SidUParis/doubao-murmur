[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "doubao-murmur"
version = "1.6.1"
description = "Controller UI for the Open Voice Input Linux daemon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lilong7676" },
    { name = "SidUParis" },
]

dependencies = [
    "PyGObject>=3.48",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
doubao-murmur = "doubao_murmur.__main__:main"

[project.urls]
Homepage = "https://github.com/SidUParis/openVoiceInput_linux"
Repository = "https://github.com/SidUParis/openVoiceInput_linux"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doubao_murmur.resources" = ["*.js", "*.css", "*.svg"]
