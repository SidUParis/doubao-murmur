app-id: com.doubao.Murmur
# GNOME runtime supplies GTK4 and PyGObject for the small controller UI.
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: doubao-murmur

finish-args:
  # Display. The overlay windowing relies on X11 (XRecord global keys,
  # _NET_WM_STATE pinning), so prefer X11 even in mixed sessions.
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri

  # Controller-only state. The read-only mount exposes one same-user mode-0600
  # Unix socket; API keys and daemon configuration remain outside the sandbox.
  - --filesystem=xdg-run/murmur-ime:ro

  # System tray (StatusNotifierItem registration with KDE/compatible trays)
  - --talk-name=org.kde.StatusNotifierWatcher

  # Version-independent module path (see app module install step)
  - --env=PYTHONPATH=/app/lib/python/site-packages

modules:
  # XRecord observes the existing right-Alt shortcut on X11. The UI contains
  # no ASR, audio, WebSocket, WebView, clipboard or host-spawn dependency.
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --no-cache-dir --prefix=/app
        python-xlib==0.33 six==1.17.0

  # Main application
  - name: doubao-murmur
    buildsystem: simple
    build-commands:
      # Install an explicit controller-only module allowlist. Historical ASR,
      # audio, paste, login and keyboard implementations stay out of runtime.
      - |
        package=/app/lib/python/site-packages/doubao_murmur
        install -d "$package/hotkey" "$package/ui"
        for file in __init__.py __main__.py app.py app_state.py \
          controller_config.py controller_worker.py daemon_control.py; do
          install -m 0644 "src/doubao_murmur/$file" "$package/$file"
        done
        for file in __init__.py edge_guard.py evdev_listener.py manager.py \
          overlay_button.py x11_listener.py; do
          install -m 0644 "src/doubao_murmur/hotkey/$file" "$package/hotkey/$file"
        done
        for file in __init__.py sni_tray.py tray_icon.py windowing.py; do
          install -m 0644 "src/doubao_murmur/ui/$file" "$package/ui/$file"
        done
      - mkdir -p /app/bin
      - |
        cat > /app/bin/doubao-murmur << 'LAUNCHER'
        #!/bin/sh
        SITE="/app/lib/python/site-packages"
        # pip-installed deps live under the runtime's python version dir
        for d in /app/lib/python3*/site-packages; do
          SITE="$SITE:$d"
        done
        export PYTHONPATH="$SITE:$PYTHONPATH"
        exec python3 -m doubao_murmur "$@"
        LAUNCHER
        chmod +x /app/bin/doubao-murmur
      - install -D flatpak/com.doubao.Murmur.desktop /app/share/applications/com.doubao.Murmur.desktop
      - install -D flatpak/com.doubao.Murmur.metainfo.xml /app/share/metainfo/com.doubao.Murmur.metainfo.xml
      - install -D flatpak/com.doubao.Murmur.svg /app/share/icons/hicolor/scalable/apps/com.doubao.Murmur.svg
    sources:
      - type: dir
        path: ..
